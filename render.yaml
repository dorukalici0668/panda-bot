services:
  - type: web
    name: panda-bot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: BOT_STATUS
        value: online
      - key: BOT_ACTIVITY
        value: panda_v2.0 | 7/24 aktif
      - key: NODE_VERSION
        value: 20.18.0
